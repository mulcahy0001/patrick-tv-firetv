name: Build Fire TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PatrickTV.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatrickTV-FireTV
          path: PatrickTV.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete firetv-latest --cleanup-tag --yes || true
          gh release create firetv-latest PatrickTV.apk --title "Patrick TV for Fire TV" --notes "Install PatrickTV.apk on a Fire TV device." --latest
